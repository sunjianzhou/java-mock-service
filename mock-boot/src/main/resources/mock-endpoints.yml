    # ===== 组代中心组织机构查询 (SOAP/XML via CXF) =====
    - id: nacao-org
      description: "组代中心组织机构查询"
      method: POST
      path: /service/nacao
      contentType: text/xml
      responseContentType: text/xml
      responseStatus: 200
      responseBody: |
        <soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
          <soap:Body>
            <NACAORESPONSE>
              <ENVELOPE>
                <RECODE>01</RECODE>
                <MESSAGE>信息正常 — {{param.JGMC}}</MESSAGE>
                <DATASIZE>1</DATASIZE>
              </ENVELOPE>
              <DATAINFO>
                <EnterPrise>
                  <JGMC>{{param.JGMC}}</JGMC>
                  <ZZJGDM>{{param.ZZJGDM}}</ZZJGDM>
                  <BGRQ>2026-05-19</BGRQ>
                  <JYQXE>1000000.00</JYQXE>
                </EnterPrise>
              </DATAINFO>
            </NACAORESPONSE>
          </soap:Body>
        </soap:Envelope>
      validation:
        requiredParams:
          - JGMC
          - ZZJGDM
        errorStatus: 400
        errorBody: |
          <soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
            <soap:Body>
              <NACAORESPONSE>
                <ENVELOPE>
                  <RECODE>99</RECODE>
                  <MESSAGE>参数校验失败: 缺少必填字段 JGMC / ZZJGDM (已提供: {{param.JGMC}} / {{param.ZZJGDM}})</MESSAGE>
                </ENVELOPE>
              </NACAORESPONSE>
            </soap:Body>
          </soap:Envelope>

    # ===== 组代中心WSDL文件 (CXF JaxWsDynamicClientFactory 初始化) =====
    - id: nacao-wsdl
      description: "组代中心WSDL文件"
      method: GET
      path: /mock/wsdl/nacao
      responseContentType: text/xml
      responseStatus: 200
      responseBody: |
        <wsdl:definitions xmlns:wsdl="http://schemas.xmlsoap.org/wsdl/"
          xmlns:soap="http://schemas.xmlsoap.org/wsdl/soap/"
          xmlns:tns="http://service.business.nacao.ninemax.com"
          targetNamespace="http://service.business.nacao.ninemax.com">
          <wsdl:message name="searchDMInfoRequest">
            <wsdl:part name="arg0" type="xsd:string"/>
          </wsdl:message>
          <wsdl:message name="searchDMInfoResponse">
            <wsdl:part name="return" type="xsd:string"/>
          </wsdl:message>
          <wsdl:portType name="SearchService">
            <wsdl:operation name="searchDMInfo">
              <wsdl:input message="tns:searchDMInfoRequest"/>
              <wsdl:output message="tns:searchDMInfoResponse"/>
            </wsdl:operation>
          </wsdl:portType>
          <wsdl:binding name="SearchServiceBinding" type="tns:SearchService">
            <soap:binding style="rpc" transport="http://schemas.xmlsoap.org/soap/http"/>
            <wsdl:operation name="searchDMInfo">
              <soap:operation soapAction=""/>
              <wsdl:input><soap:body use="literal" namespace="http://service.business.nacao.ninemax.com"/></wsdl:input>
              <wsdl:output><soap:body use="literal" namespace="http://service.business.nacao.ninemax.com"/></wsdl:output>
            </wsdl:operation>
          </wsdl:binding>
          <wsdl:service name="SearchService">
            <wsdl:port name="SearchServicePort" binding="tns:SearchServiceBinding">
              <soap:address location="http://localhost:8080/service/nacao"/>
            </wsdl:port>
          </wsdl:service>
        </wsdl:definitions>
