    # ===== 金联汇通简项身份证认证 (JSON + pathPattern) =====
    # pathPattern 支持动态路径变量 {type} 和 {appId}，模拟真实金联汇通URL结构
    # 其余3个金联汇通端点使用独立mock路径，因4个端点共享同一URL模式仅靠biz_type区分
    - id: eid-id-card
      description: "金联汇通简项身份证认证"
      method: POST
      pathPattern: "/vals-ap/identity/{type}/sync/{appId}"
      contentType: application/json
      responseContentType: application/json
      responseStatus: 200
      responseBody: |
        {
          "version": "1.0.0",
          "result": "0000",
          "result_detail": "认证一致",
          "result_msg": "成功",
          "result_time": "2026-05-19T12:00:00",
          "biz_sequence_id": "MOCK202605190003",
          "security_factor": "{\"encrypt_factor\":\"abcdef1234567890\",\"sign_factor\":\"fedcba0987654321\"}",
          "sign_type": "SM3",
          "sign": "MOCK_SIGN_EID_ID_CARD_20260519",
          "encrypt_type": "SM4",
          "appeidcode": "MOCK_APP_EID_CODE_001"
        }
      validation:
        requiredParams:
          - app_id
          - biz_type
          - user_id_info
        errorStatus: 400
        errorBody: |
          {"error_no":"1001","error_info":"参数校验失败: 缺少必填字段"}

