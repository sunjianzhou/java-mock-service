# ============================================================
# Mock Service — Demo 参数示例 & 配置参考
# ============================================================
# 本文件展示 Mock 服务支持的全部配置能力，
# 覆盖 3 种协议风格、2 种路径模式、多种响应类型。
# 新人可参照此文件编写适配自己系统的 mock-endpoints.yml。
#
# 核心概念：
#   - 每个 endpoint 由 (method + path/pathPattern) 唯一标识
#   - contentType 决定协议适配器选择（form/json/xml）
#   - responseBody 为静态文本，直接原样返回，不经过模板引擎
#   - 新增端点只需在 YAML 中添加一段配置，零 Java 代码
# ============================================================

mock:
  endpoints:

    # ╔══════════════════════════════════════════════════════╗
    # ║  示例 1: Form-encoded 协议（证通系列）               ║
    # ╚══════════════════════════════════════════════════════╝
    # 请求方式：POST
    # Content-Type: application/x-www-form-urlencoded
    # 参数格式：key1=value1&key2=value2（URL 编码）
    # 适用场景：传统表单 POST 接口，如证通简项/人像/绿卡
    # ---------------------------------------------------
    - id: demo-form
      description: "Form-encoded 接口示例"
      method: POST                           # HTTP 方法: GET / POST
      path: /mock/demo/form-endpoint         # 精确匹配路径
      contentType: application/x-www-form-urlencoded  # 请求 Content-Type
      responseContentType: application/json           # 响应 Content-Type
      responseStatus: 200                   # HTTP 状态码
      responseBody: |                        # 响应体（| 表示多行字符串）
        {
          "code": "0",
          "message": "form demo success"
        }

    # ╔══════════════════════════════════════════════════════╗
    # ║  示例 2: JSON 协议（金联汇通/BJCA 系列）            ║
    # ╚══════════════════════════════════════════════════════╝
    # 请求方式：POST
    # Content-Type: application/json
    # 参数格式：{"key": "value"}（JSON 对象）
    # 适用场景：现代 REST 风格接口，如金联汇通简项/人像、
    #          北京数字认证组织机构认证
    # ---------------------------------------------------
    - id: demo-json
      description: "JSON 接口示例"
      method: POST
      path: /mock/demo/json-endpoint
      contentType: application/json
      responseContentType: application/json
      responseStatus: 200
      responseBody: |
        {
          "version": "1.0.0",
          "result": "0000",
          "result_detail": "json demo success",
          "result_msg": "成功"
        }

    # ╔══════════════════════════════════════════════════════╗
    # ║  示例 3: XML/SOAP 协议（组代中心 Nacao 系列）       ║
    # ╚══════════════════════════════════════════════════════╝
    # 请求方式：POST
    # Content-Type: text/xml
    # 参数格式：XML / SOAP Envelope
    # 适用场景：传统 WebService/SOAP 接口，如组代中心机构查询。
    # XML body 中的叶子元素（无子元素的标签）会被提取为参数，支持校验和模板回显。
    # ---------------------------------------------------
    - id: demo-xml
      description: "XML/SOAP 接口示例 — 带参数校验和模板回显"
      method: POST
      path: /mock/demo/soap-endpoint
      contentType: text/xml
      responseContentType: text/xml       # 响应也是 XML
      responseStatus: 200
      responseBody: |
        <soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">
          <soap:Body>
            <Response>
              <Code>01</Code>
              <Message>soap demo success — {{param.JGMC}}</Message>
            </Response>
          </soap:Body>
        </soap:Envelope>
      validation:
        requiredParams:
          - JGMC
        errorStatus: 400
        errorBody: |
          {"error_no":"1001","error_info":"缺少必填字段 JGMC"}

    # ╔══════════════════════════════════════════════════════╗
    # ║  示例 4: GET 请求（WSDL / 静态资源）                ║
    # ╚══════════════════════════════════════════════════════╝
    # 请求方式：GET（无需 contentType）
    # 适用场景：WSDL 文件、静态文本资源、管理信息
    # ---------------------------------------------------
    - id: demo-get
      description: "GET 接口示例"
      method: GET
      path: /mock/demo/get-endpoint
      # GET 请求无需 contentType（也不校验）
      responseContentType: text/xml
      responseStatus: 200
      responseBody: |
        <?xml version="1.0" encoding="UTF-8"?>
        <info>GET demo content</info>

    # ╔══════════════════════════════════════════════════════╗
    # ║  示例 5: pathPattern 动态路径                        ║
    # ╚══════════════════════════════════════════════════════╝
    # pathPattern 支持 {variable} 占位符，匹配动态 URL 段。
    # 当 pathPattern 非空时，路由优先使用 pathPattern，
    # path 字段会被忽略（启动日志会提示 WARN）。
    #
    # 路径变量自动合并到参数 Map 中，可通过 {{param.xxx}} 模板回显。
    # body 参数优先级高于路径变量（同名时 body 覆盖 path）。
    #
    # 示例：以下配置可匹配:
    #   POST /api/users/123/orders/456
    #   POST /api/users/abc/orders/xyz
    # ---------------------------------------------------
    - id: demo-path-pattern
      description: "pathPattern 动态路径示例"
      method: POST
      pathPattern: /api/users/{userId}/orders/{orderId}
      # 注意: 设置了 pathPattern 后无需再设 path
      contentType: application/json
      responseContentType: application/json
      responseStatus: 200
      responseBody: |
        {
          "code": "0",
          "message": "pathPattern demo success",
          "userId": "{{param.userId}}",
          "orderId": "{{param.orderId}}"
        }

    # ╔══════════════════════════════════════════════════════╗
    # ║  示例 6: 自定义 HTTP 状态码（模拟业务错误）         ║
    # ╚══════════════════════════════════════════════════════╝
    # responseStatus 可设置为任意有效 HTTP 状态码，
    # 用于模拟 4xx/5xx 等错误场景。
    # ---------------------------------------------------
    - id: demo-error-400
      description: "模拟参数错误 400"
      method: POST
      path: /mock/demo/error-400
      contentType: application/json
      responseContentType: application/json
      responseStatus: 400              # 返回 400 状态码
      responseBody: |
        {
          "code": "1001",
          "message": "参数校验失败: 缺少必填字段 name"
        }

    - id: demo-error-500
      description: "模拟服务内部错误 500"
      method: POST
      path: /mock/demo/error-500
      contentType: application/json
      responseContentType: application/json
      responseStatus: 500              # 返回 500 状态码
      responseBody: |
        {
          "code": "9999",
          "message": "服务内部异常"
        }

    # ╔══════════════════════════════════════════════════════╗
    # ║  示例 7: 详细描述字段                                ║
    # ╚══════════════════════════════════════════════════════╝
    # description 会在启动日志、管理端点中展示，
    # 建议用中文写清楚业务含义，方便其他同事理解。
    # ---------------------------------------------------
    - id: demo-with-desc
      description: "这是带详细业务说明的示例端点 — 证通简项身份证二要素认证（姓名+身份证号）"
      method: POST
      path: /mock/demo/with-description
      contentType: application/x-www-form-urlencoded
      responseContentType: application/json
      responseStatus: 200
      responseBody: |
        {
          "error_no": "0",
          "error_info": "demo with description success",
          "dsName": ["results"],
          "results": [{
            "cerkey": "",
            "respinfo": "认证一致",
            "mpssim": 85.5,
            "biztyp": "A001",
            "status": "1",
            "sysSeqNb": "DEMO202605190001",
            "respcd": "0000",
            "certseq": "",
            "accountName": "示例姓名",
            "name": "示例姓名",
            "ptyAcct": "demoacct",
            "ptycd": "demoacct",
            "localsim": 88.2,
            "telephone": ""
          }]
        }

    # ╔══════════════════════════════════════════════════════╗
    # ║  示例 8: 请求参数校验（validation）                  ║
    # ╚══════════════════════════════════════════════════════╝
    # validation 配置声明必填参数列表，由 Mock 服务自动校验。
    # 请求体参数提取规则因 contentType 而异：
    #   form-encoded → 提取表单参数
    #   JSON         → 提取顶层 string 字段
    #   XML/SOAP     → 提取所有叶子元素（DOM 解析，namespace-unaware）
    #
    # 校验流程：
    #   1. 协议适配器从请求体提取参数 → Map<String, String>
    #   2. 逐一检查 requiredParams 列表中的每个 key
    #   3. 全部存在于 Map 且值非空 → 返回 responseStatus + responseBody
    #   4. 任一缺失或为空         → 返回 errorStatus + errorBody
    # ---------------------------------------------------
    - id: demo-validation-form
      description: "Form-encoded 参数校验示例 — 缺少必填字段返回 400"
      method: POST
      path: /mock/demo/validation-form
      contentType: application/x-www-form-urlencoded
      responseContentType: application/json
      responseStatus: 200
      responseBody: |
        {
          "error_no": "0",
          "error_info": "validation passed"
        }
      validation:
        requiredParams:
          - certseq
          - usernm
          - biztyp
        errorStatus: 400
        errorBody: |
          {"error_no":"1001","error_info":"参数校验失败: 缺少必填字段 certseq / usernm / biztyp"}

    - id: demo-validation-json
      description: "JSON 参数校验示例"
      method: POST
      path: /mock/demo/validation-json
      contentType: application/json
      responseContentType: application/json
      responseStatus: 200
      responseBody: |
        {
          "result": "0000",
          "result_detail": "validation passed"
        }
      validation:
        requiredParams:
          - app_id
          - biz_type
          - user_id_info
        errorStatus: 400
        errorBody: |
          {"error_no":"1001","error_info":"参数校验失败: 缺少必填字段 app_id / biz_type / user_id_info"}

    # ╔══════════════════════════════════════════════════════╗
    # ║  示例 9: 动态响应模板引擎                            ║
    # ╚══════════════════════════════════════════════════════╝
    # responseBody / errorBody 支持 {{param.fieldName}} 占位符，
    # Mock 服务会在返回响应前自动替换为请求参数的实际值。
    #
    # 模板语法：
    #   {{param.fieldName}}  → 替换为请求参数 fieldName 的值
    #   缺少对应参数          → 替换为空字符串 ""
    #   无 {{param.xxx}}      → 原样返回（零开销，不做任何处理）
    #
    # 适用场景：
    #   - 将请求中的 name / idNumber 回显到响应中，模拟真实接口
    #   - 在 errorBody 中提示缺失的具体字段名
    # ---------------------------------------------------
    - id: demo-template-form
      description: "Form-encoded 模板回显示例"
      method: POST
      path: /mock/demo/template-form
      contentType: application/x-www-form-urlencoded
      responseContentType: application/json
      responseStatus: 200
      responseBody: |
        {
          "error_no": "0",
          "error_info": "",
          "dsName": ["results"],
          "results": [{
            "certseq": "",
            "respinfo": "认证一致",
            "mpssim": 85.5,
            "status": "1",
            "sysSeqNb": "MOCK{{param.certseq}}",
            "respcd": "0000",
            "accountName": "{{param.usernm}}",
            "name": "{{param.usernm}}",
            "ptyAcct": "{{param.ptyacct}}",
            "ptycd": "{{param.ptycd}}"
          }]
        }
      validation:
        requiredParams:
          - certseq
          - usernm
        errorStatus: 400
        errorBody: |
          {"error_no":"1001","error_info":"参数校验失败: 缺少必填字段 {{param.certseq}} 或 {{param.usernm}}"}

    - id: demo-template-json
      description: "JSON 模板回显示例"
      method: POST
      path: /mock/demo/template-json
      contentType: application/json
      responseContentType: application/json
      responseStatus: 200
      responseBody: |
        {
          "version": "1.0.0",
          "result": "0000",
          "result_detail": "认证一致",
          "result_msg": "成功",
          "biz_sequence_id": "MOCK_{{param.app_id}}",
          "appeidcode": "{{param.app_id}}"
        }
      validation:
        requiredParams:
          - app_id
          - biz_type
        errorStatus: 400
        errorBody: |
          {"error_no":"1001","error_info":"缺少 {{param.app_id}} 或 {{param.biz_type}}"}

    # ╔══════════════════════════════════════════════════════╗
    # ║  示例 10: 参数格式校验（正则规则）                   ║
    # ╚══════════════════════════════════════════════════════╝
    # paramRules 用于对参数值进行正则格式校验。
    # 校验顺序：先必填检查 → 再格式检查 → 都通过才返回 200。
    #
    # 格式校验规则：
    #   - 仅当参数存在且非空时触发格式检查
    #   - 参数值不匹配正则 → 返回 errorStatus + errorBody
    #   - errorBody 支持模板占位符，可动态回显错误信息
    # ---------------------------------------------------
    - id: demo-format-check
      description: "参数格式校验示例 — idNumber 必须是18位数字"
      method: POST
      path: /mock/demo/format-check
      contentType: application/x-www-form-urlencoded
      responseContentType: application/json
      responseStatus: 200
      responseBody: |
        {
          "error_no": "0",
          "error_info": "",
          "results": [{
            "name": "{{param.name}}",
            "idNumber": "{{param.idNumber}}",
            "status": "1"
          }]
        }
      validation:
        requiredParams:
          - name
          - idNumber
        paramRules:
          - name: idNumber
            pattern: "^\\d{17}[\\dXx]$"
            errorMessage: "idNumber 必须是18位数字（末位可为X）"
          - name: name
            pattern: "^.{2,20}$"
            errorMessage: "name 长度需在2-20个字符之间"
        errorStatus: 400
        errorBody: |
          {"error_no":"1002","error_info":"参数格式校验失败: {{param.idNumber}} / {{param.name}}"}

    # ╔══════════════════════════════════════════════════════╗
    # ║  示例 11: 响应延迟模拟（模拟慢网络/后端处理）       ║
    # ╚══════════════════════════════════════════════════════╝
    # responseDelay 指定响应延迟时间（毫秒），用于模拟超时、慢网络等场景。
    # 默认 0（无延迟）。延迟仅在响应体（body）上施加，不阻塞其他请求。
    # ---------------------------------------------------
    - id: demo-slow
      description: "慢响应端点（模拟500ms延迟）"
      method: POST
      path: /mock/demo/slow-endpoint
      contentType: application/json
      responseContentType: application/json
      responseStatus: 200
      responseDelay: 500             # 延迟 500ms 再返回
      responseBody: |
        {
          "code": "0",
          "message": "slow response after 500ms delay"
        }

    # ╔══════════════════════════════════════════════════════╗
    # ║  示例 12: 条件响应（根据参数值返回不同内容）        ║
    # ╚══════════════════════════════════════════════════════╝
    # conditionalResponse 根据指定参数的值返回不同响应体。
    # 适用于：同一接口在不同业务状态下返回不同结果。
    #
    # 匹配规则：
    #   1. 提取请求参数中 param 字段的值
    #   2. 在 cases 映射中查找匹配的响应体
    #   3. 命中 → 返回对应响应体（支持模板占位符）
    #   4. 未命中 → 返回 defaultResponse（如有配置）
    #   5. 无 defaultResponse → 回退到 responseBody
    # ---------------------------------------------------
    - id: demo-conditional
      description: "条件响应示例 — 根据 status 参数返回不同结果"
      method: POST
      path: /mock/demo/conditional
      contentType: application/x-www-form-urlencoded
      responseContentType: application/json
      responseStatus: 200
      responseBody: |
        {"error_no":"0","error_info":"默认成功 — {{param.name}}"}
      conditionalResponse:
        param: status
        cases:
          "1": |
            {"error_no":"0","error_info":"认证一致 — {{param.name}}","score":85}
          "2": |
            {"error_no":"1","error_info":"认证不一致 — {{param.name}}","score":30}
          "3": |
            {"error_no":"2","error_info":"库中无此证件 — {{param.name}}"}
        defaultResponse: |
          {"error_no":"0","error_info":"默认成功 — {{param.name}}"}

    # ╔══════════════════════════════════════════════════════╗
    # ║  示例 13: 响应体外部文件加载                         ║
    # ╚══════════════════════════════════════════════════════╝
    # responseBodyFile 从外部文件加载响应体，避免大段 JSON 嵌在 YAML 中。
    # 支持 classpath: 和 file: 两种前缀。
    # 优先级：responseScript > responseBodyFile > conditionalResponse > responseBody
    # ---------------------------------------------------
    - id: demo-file-classpath
      description: "从 classpath 加载响应体文件"
      method: POST
      path: /mock/demo/file-classpath
      contentType: application/json
      responseContentType: application/json
      responseStatus: 200
      responseBodyFile: classpath:responses/demo-response.json
      # 文件不存在时会返回错误 JSON

    - id: demo-file-external
      description: "从外部文件系统加载响应体"
      method: POST
      path: /mock/demo/file-external
      contentType: application/json
      responseContentType: application/json
      responseStatus: 200
      responseBodyFile: file:./config/responses/demo-response.json
      # 适合热加载场景：修改外部文件后调用 /mock/_admin/reload 即可生效

    # ╔══════════════════════════════════════════════════════╗
    # ║  示例 14: 随机延迟范围（模拟真实网络抖动）          ║
    # ╚══════════════════════════════════════════════════════╝
    # responseDelay + responseDelayMax 定义延迟范围 [min, max]。
    # 仅 responseDelay 时 → 固定延迟（向后兼容）
    # 同时设置两者且 responseDelayMax > responseDelay → 随机取值
    # ---------------------------------------------------
    - id: demo-random-delay
      description: "随机延迟 500~2000ms，模拟网络抖动"
      method: POST
      path: /mock/demo/random-delay
      contentType: application/json
      responseContentType: application/json
      responseStatus: 200
      responseDelay: 500             # 最小延迟 500ms
      responseDelayMax: 2000         # 最大延迟 2000ms，实际 = 500 + random(0, 1500)
      responseBody: |
        {
          "code": "0",
          "message": "response with random delay 500~2000ms"
        }

    # ╔══════════════════════════════════════════════════════╗
    # ║  示例 15: 动态响应脚本（Nashorn JavaScript）        ║
    # ╚══════════════════════════════════════════════════════╝
    # responseScript 使用 Java 8 内置 Nashorn 引擎执行 JS 脚本。
    # 脚本中可直接访问 params 变量（Map<String, String>）。
    # 脚本返回值即为响应体（字符串）。
    #
    # 优先级：responseScript > responseBodyFile > conditionalResponse > responseBody
    #
    # 适用场景：
    #   - 生成动态时间戳 / 签名（如 HMAC、MD5）
    #   - 根据业务规则动态计算响应字段
    #   - 模拟带时效性的 token 返回
    # ---------------------------------------------------
    - id: demo-script-timestamp
      description: "脚本生成时间戳和动态签名"
      method: POST
      path: /mock/demo/script-timestamp
      contentType: application/json
      responseContentType: application/json
      responseStatus: 200
      responseScript: |
        var ts = new Date().getTime();
        var sign = (params.app_id || "unknown") + "_" + ts;
        JSON.stringify({
          version: "1.0.0",
          result: "0000",
          result_detail: "认证一致",
          timestamp: ts,
          sign: sign,
          echo_name: params.name || "unknown"
        });

    - id: demo-script-sign
      description: "脚本生成 MD5 签名（需 JDK 自带 MessageDigest）"
      method: POST
      path: /mock/demo/script-sign
      contentType: application/json
      responseContentType: application/json
      responseStatus: 200
      responseScript: |
        var ts = new Date().getTime();
        var raw = (params.app_id || "") + ts + "secret_key";
        var digest = java.security.MessageDigest.getInstance("MD5");
        var hash = digest.digest(raw.getBytes("UTF-8"));
        var hex = "";
        for (var i = 0; i < hash.length; i++) {
          var h = (hash[i] & 0xFF).toString(16);
          if (h.length == 1) h = "0" + h;
          hex += h;
        }
        JSON.stringify({
          version: "1.0.0",
          result: "0000",
          timestamp: ts,
          sign: hex,
          biz_sequence_id: "MOCK_" + ts
        });

# ============================================================
# WebSocket Mock 端点
# ============================================================
# WebSocket 端点独立于 HTTP endpoints，使用 SimpleUrlHandlerMapping 注册。
# 支持连接欢迎消息、模式匹配回显、心跳、断开消息。
# -------------------------------------------------------------------

websockets:
  - id: ws-echo
    description: "WebSocket Echo 示例 — 模式匹配回显"
    path: /ws/echo
    onConnect: "{\"type\":\"hello\",\"sid\":\"{{sessionId}}\"}"
    onDisconnect: "{\"type\":\"bye\",\"sid\":\"{{sessionId}}\"}"
    messageHandlers:
      - pattern: ".*"               # 匹配任意消息
        response: "{\"type\":\"echo\",\"text\":\"{{message}}\"}"
    heartbeat:
      interval: 30000               # 每 30s 发送心跳
      message: "{\"type\":\"ping\"}"
    delay: 0                        # 消息回显延迟（毫秒）

  - id: ws-chat
    description: "WebSocket 聊天模拟"
    path: /ws/chat
    onConnectFile: classpath:ws-welcome.json  # 可从外部文件加载
    messageHandlers:
      - pattern: "(?i).*hello.*"
        response: "{\"type\":\"chat\",\"reply\":\"Hi there! You said: {{message}}\"}"
      - pattern: "(?i).*bye.*"
        response: "{\"type\":\"chat\",\"reply\":\"Goodbye!\"}"
      - pattern: ".*"
        response: "{\"type\":\"echo\",\"text\":\"{{message}}\"}"
    heartbeat:
      interval: 30000
      message: "{\"type\":\"ping\"}"

# ============================================================
# 配置规范速查
# ============================================================
#
# 必填字段:
#   id                    — 唯一标识（英文，建议 provider-type 格式）
#   method                — GET 或 POST
#   path 或 pathPattern   — 至少设置一个
#   responseContentType   — 响应 Content-Type
#   responseBody / errorBody  — 响应体文本，支持模板占位符 {{param.fieldName}}
#
# 可选字段:
#   pathPattern           — 路径模式，支持 Spring {variable} 占位符
#   contentType           — 请求 Content-Type（GET 请求可不设）
#   responseStatus        — HTTP 状态码（默认 200）
#   responseDelay         — 响应延迟毫秒数（默认 0，无延迟）
#   responseDelayMax      — 响应延迟最大值，> responseDelay 时随机取值（详见示例 14）
#   responseBodyFile      — 外部文件路径，classpath: 或 file: 前缀（详见示例 13）
#   responseScript        — Nashorn JS 脚本，优先级最高（详见示例 15）
#   description           — 业务描述（建议填写）
#   conditionalResponse   — 条件响应配置（详见示例 12）
#     conditionalResponse.param        — 条件判断参数名
#     conditionalResponse.cases        — 参数值 → 响应体的映射
#     conditionalResponse.defaultResponse — 未命中时的兜底响应
#   validation            — 参数校验配置（详见示例 8）
#     validation.requiredParams  — 必填参数名列表
#     validation.paramRules      — 格式校验规则（正则，详见示例 10）
#     validation.errorStatus     — 校验失败 HTTP 状态码（默认 400）
#     validation.errorBody       — 校验失败响应体（支持模板占位符）
#
# 响应体解析优先级:
#   responseScript > responseBodyFile > conditionalResponse > responseBody
#
# 响应模板语法（详见示例 9）:
#   {{param.fieldName}}  → 替换为请求参数的值
#   {{param.missing}}    → 参数不存在时替换为空字符串（不报错）
#   无占位符             → 原样返回，零开销
#
# 模板参数来源（按优先级合并）:
#   1. 路径变量（pathPattern {var}）     → 较低优先级
#   2. 请求体参数（form/JSON/XML 提取）  → 较高优先级，同名覆盖路径变量
#   3. 所有参数统一通过 {{param.xxx}} 访问
#
#   示例: pathPattern=/api/{type}/data, body: type=override
#         → {{param.type}} 结果为 "override"（body 覆盖 path）
#
# 支持的 contentType 值:
#   application/x-www-form-urlencoded  → FormUrlEncodedAdapter
#   application/json                  → JsonAdapter
#   text/xml                          → XmlAdapter
#
# 路径匹配优先级:
#   pathPattern 非空 → 使用 pathPattern（支持 {var} 动态段）
#   pathPattern 为空 → 使用 path（精确匹配）
#   同时设置       → WARN 日志 + 使用 pathPattern
#
# 启动校验（fail-fast）:
#   - 每个字段非空校验
#   - (method, effectivePath) 重复检测
#   - endpoints 列表不为空
#   - 任何校验失败 → 拒绝启动 + 明确错误消息
#
# 管理端点:
#   GET  /mock/_admin/routes      → 返回所有已注册路由的 JSON 清单（含 WebSocket）
#   POST /mock/_admin/reload      → 从 classpath:mock-endpoints.yml 重新加载配置
#   POST /mock/_admin/record/start  → 开始录制
#   POST /mock/_admin/record/stop   → 停止录制
#   GET  /mock/_admin/recordings    → 列出录制记录
#   DELETE /mock/_admin/recordings  → 清空录制记录
#   POST /mock/_admin/recordings/save  → 保存录制到文件
#   POST /mock/_admin/recordings/load → 从文件加载录制
#   POST /mock/_admin/replay/start → 开启回放模式
#   POST /mock/_admin/replay/stop  → 关闭回放模式
#   GET  /mock/_admin/postman      → 导出 Postman Collection v2.1
#   mock.watch-path=file:./config/mock-endpoints.yml → 文件监听自动热加载
#
# 审计日志:
#   AUDIT logger 记录每个请求的方法、路径、状态码和耗时（毫秒）。
#   日志格式: POST /mock/ias/zt/id-card → 200 (12ms)
#   配置 logback-spring.xml 可将审计日志写入独立文件。
#
# Actuator & Prometheus:
#   GET /actuator/health     → 健康检查（含磁盘空间状态）
#   GET /actuator/info       → 服务信息
#   GET /actuator/metrics    → HTTP 请求指标
#   GET /actuator/prometheus → Prometheus 指标（含自定义 mock_* 指标）
#
# Swagger UI:
#   GET /swagger-ui.html   → Swagger UI 接口文档
#
# ============================================================
# 常见问题
# ============================================================
#
# Q: 如何让 Mock 响应随请求参数变化？
# A: 当前支持参数必填校验（validation.requiredParams）。
#    缺失参数返回 errorStatus + errorBody，通过则返回 responseBody。
#    responseBody 和 errorBody 均支持 {{param.fieldName}} 占位符动态回显参数值。
#
# Q: 修改了 YAML 配置后需要重启服务吗？
# A: 不需要。有两种热加载方式:
#    1) 调用 POST /mock/_admin/reload 手动触发重载
#    2) 在 application.yml 中设置 mock.watch-path=file:./config/mock-endpoints.yml
#       服务会自动监听文件变更并触发重载（需将配置文件放在 JAR 外部）。
#    热加载会做完整的配置校验，失败则保持旧配置不变。
#
# Q: 能否配置自定义响应头？
# A: 当前自动添加 X-Mock-Endpoint 响应头。
#    自定义 headers 在后续版本计划中。
#
# Q: pathPattern 中的 {variable} 路径变量能回显到响应吗？
# A: 可以。路径变量会自动合并到参数 Map，通过 {{param.xxx}} 访问。
#    例如 pathPattern=/api/{userId}/data，请求 /api/123/data 时，
#    {{param.userId}} 会被替换为 "123"。
#    注意: body 参数优先级更高，同名 key 会覆盖路径变量的值。
#
# Q: path 和 pathPattern 都设置会怎样？
# A: 启动时打印 WARN 日志，实际使用 pathPattern。
#    建议只设置两者之一，避免歧义。
#
# Q: 每个 endpoint 的 responseBody 有大小限制吗？
# A: 无硬性限制，但全部 endpoint 配置在 JVM 堆中。
#    11 个典型 endpoint 占用 < 200KB 内存。
#    大的响应体建议使用 responseBodyFile 放在外部文件中。
#
# Q: 如何录制真实接口的调用并回放？
# A: 通过管理端点控制:
#    POST /mock/_admin/record/start  → 开始录制，所有 Mock 请求自动记录
#    POST /mock/_admin/record/stop   → 停止录制
#    POST /mock/_admin/replay/start  → 开启回放模式，匹配的请求直接返回录制响应
#    POST /mock/_admin/replay/stop   → 关闭回放模式
#    录制数据保存在 recordings/recordings.json，可 save/load 持久化。
#
# Q: 如何对接 Prometheus + Grafana 监控？
# A: GET /actuator/prometheus 返回 Prometheus 格式指标，包括:
#    - mock_requests_total (Counter)     — 请求计数（按 method/endpoint/status）
#    - mock_request_duration_seconds     — 请求延迟直方图
#    - mock_recording_active (0/1)       — 录制状态
#    - mock_replay_active (0/1)          — 回放状态
#    - mock_websocket_sessions           — WebSocket 活跃连接数
#    将 /actuator/prometheus 配置为 Prometheus 的 scrape target 即可。
#
# Q: 如何导出 Postman Collection 给联调团队？
# A: GET /mock/_admin/postman 一键导出 Postman Collection v2.1 JSON。
#    包含所有端点的 URL、Method、Headers、Body 示例。
#    导入 Postman 后设置 baseUrl 变量即可使用。
#
# Q: responseScript 支持哪些 JS 能力？
# A: Java 8 内置 Nashorn 引擎，支持:
#    - 标准 JS 语法（JSON.stringify、Date、Math）
#    - 访问 params 变量（params.name、params.idNumber）
#    - 调用 Java 类库（java.security.MessageDigest、java.util.UUID 等）
#    脚本返回值即为响应体，无需 return 语句。
